services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forkity
      POSTGRES_USER: forkity
      POSTGRES_PASSWORD: forkity
    ports:
      - "5432:5432"
    volumes:
      - forkity-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkity -d forkity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forkity-postgres-data: